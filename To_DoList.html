<!DOCTYPE html>
<html>
<head>

    <title>Todo List</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #333;
            color: white;
        }

        input,
        textarea {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 80px;
        }

        .task-card {
            text-align: left;
            background-color: #f5f5f5;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>TODO LIST</h1>

        <div>

            <button onclick="showAddTask()">
                Add Task
            </button>

            <button onclick="showTasks()">
                View Tasks
            </button>

            <button onclick="showCompleted()">
                Completed
            </button>

        </div>


        <!-- Add Task -->

        <div id="addSection">

            <h2>Add New Task</h2>

            <input
                type="text"
                id="taskTitle"
                placeholder="Task Title"
            >

            <textarea
                id="taskDescription"
                placeholder="Task Description"
            ></textarea>

            <br>

            <button onclick="addTask()">
                Add Task
            </button>

        </div>


        <!-- Tasks -->

        <div id="taskSection">

            <h2>My Tasks</h2>

            <div id="taskList"></div>

        </div>

    </div>


    <script>

        function addTask() {

            let title =
                document.getElementById("taskTitle").value;

            let description =
                document.getElementById("taskDescription").value;


            if (title == "" || description == "") {

                alert("Please fill all fields");

                return;
            }


            let taskList =
                document.getElementById("taskList");


            taskList.innerHTML += `

                <div class="task-card">

                    <h3>${title}</h3>

                    <p>${description}</p>

                    <button onclick="completeTask(this)">
                        Complete
                    </button>

                    <button onclick="deleteTask(this)">
                        Delete
                    </button>

                </div>

            `;


            document.getElementById("taskTitle").value = "";

            document.getElementById("taskDescription").value = "";

        }


        function completeTask(button) {

            button.parentElement.style.textDecoration =
                "line-through";

            button.innerText = "Completed";

        }


        function deleteTask(button) {

            button.parentElement.remove();

        }


        function showAddTask() {

            document.getElementById("addSection").style.display =
                "block";

            document.getElementById("taskSection").style.display =
                "none";

        }


        function showTasks() {

            document.getElementById("addSection").style.display =
                "none";

            document.getElementById("taskSection").style.display =
                "block";


            let tasks =
                document.querySelectorAll(".task-card");


            for (let i = 0; i < tasks.length; i++) {

                tasks[i].style.display = "block";

            }

        }


        function showCompleted() {

            document.getElementById("addSection").style.display =
                "none";

            document.getElementById("taskSection").style.display =
                "block";


            let tasks =
                document.querySelectorAll(".task-card");


            for (let i = 0; i < tasks.length; i++) {

                if (
                    tasks[i].style.textDecoration ==
                    "line-through"
                ) {

                    tasks[i].style.display = "block";

                } else {

                    tasks[i].style.display = "none";

                }

            }

        }

    </script>

</body>
</html>=
