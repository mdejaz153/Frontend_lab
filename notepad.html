<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leaf Notes</title>
<style>
:root{--bg:#f3f0e7;--paper:#fffdf7;--ink:#26352b;--muted:#758077;--accent:#6d8b74;--line:#deddd3;--shadow:0 18px 45px rgba(45,58,47,.12)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#e8eee5,#f5efe4);color:var(--ink);min-height:100vh}
.app{width:min(1180px,94vw);height:88vh;margin:6vh auto;background:var(--paper);border:1px solid rgba(80,100,84,.12);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:260px 1fr}
.sidebar{background:#e7ece3;padding:24px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{font-weight:800;font-size:21px;margin:0 8px 22px}.brand span{color:var(--accent)}
.new{border:0;background:var(--accent);color:white;padding:12px 14px;border-radius:12px;font-weight:700;cursor:pointer}.notes{margin-top:20px;overflow:auto;display:grid;gap:8px}.note{padding:12px;border-radius:12px;cursor:pointer}.note:hover,.note.active{background:rgba(255,255,255,.65)}.note b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note small{color:var(--muted)}
.sidefoot{margin-top:auto;color:var(--muted);font-size:12px;padding:8px}.main{display:flex;flex-direction:column;min-width:0}.topbar{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tool{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:9px;cursor:pointer;color:var(--ink)}.tool:hover{background:#f1f4ee}.spacer{flex:1}.status{font-size:12px;color:var(--muted)}
.editor{padding:34px clamp(22px,5vw,70px);overflow:auto;flex:1}.title{width:100%;border:0;outline:0;background:transparent;font-size:34px;font-weight:800;color:var(--ink);margin-bottom:18px}.content{min-height:55vh;outline:none;font-family:Georgia,serif;font-size:18px;line-height:1.8;white-space:pre-wrap}.content:empty:before{content:attr(data-placeholder);color:#a5aaa2}.bottom{padding:10px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.dark{--bg:#1e2620;--paper:#252e27;--ink:#e8eee8;--muted:#aab4ac;--line:#3a463d;--accent:#88a78e}.dark body,.dark{background:#1e2620}.dark .sidebar{background:#202921}.dark .tool{background:#2c372f}.dark .note:hover,.dark .note.active{background:#303b32}.dark .title{color:var(--ink)}
@media(max-width:720px){.app{grid-template-columns:1fr;height:96vh;margin:2vh auto}.sidebar{display:none}.editor{padding:24px}.title{font-size:28px}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand">🍃 Leaf<span>Notes</span></div><button class="new" onclick="newNote()">＋ New note</button><div class="notes" id="notes"></div><div class="sidefoot">Notes are saved automatically in your browser.</div></aside><main class="main"><div class="topbar"><button class="tool" onclick="cmd('bold')"><b>B</b></button><button class="tool" onclick="cmd('italic')"><i>I</i></button><button class="tool" onclick="cmd('underline')"><u>U</u></button><button class="tool" onclick="cmd('insertUnorderedList')">• List</button><button class="tool" onclick="cmd('undo')">↶ Undo</button><button class="tool" onclick="cmd('redo')">↷ Redo</button><div class="spacer"></div><span class="status" id="status">Saved</span><button class="tool" onclick="downloadNote()">Download</button><button class="tool" onclick="deleteNote()">Delete</button><button class="tool" onclick="toggleTheme()">☾</button></div><section class="editor"><input id="title" class="title" placeholder="Untitled note"><div id="content" class="content" contenteditable="true" data-placeholder="Start writing your thoughts..."></div></section><footer class="bottom"><span id="count">0 words</span><span>Ctrl/Cmd + S to save</span></footer></main></div>
<script>
const KEY='leafnotes-v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null;const $=s=>document.querySelector(s),notes=$('#notes'),title=$('#title'),content=$('#content'),status=$('#status');
function seed(){if(!data.length)data=[{id:Date.now(),title:'Welcome to Leaf Notes',content:'A calm place for your ideas.\n\nCreate a note, edit it, format text and download it whenever you want.',updated:Date.now()}]}
function save(){if(current==null)return;let n=data.find(x=>x.id===current);n.title=title.value||'Untitled note';n.content=content.innerHTML;n.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(data));status.textContent='Saved';render();countWords()}
function schedule(){status.textContent='Saving…';clearTimeout(window.t);window.t=setTimeout(save,350)}
function render(){notes.innerHTML='';[...data].sort((a,b)=>b.updated-a.updated).forEach(n=>{let d=document.createElement('div');d.className='note '+(n.id===current?'active':'');d.innerHTML=`<b>${escapeHtml(n.title||'Untitled note')}</b><small>${new Date(n.updated).toLocaleDateString()}</small>`;d.onclick=()=>openNote(n.id);notes.appendChild(d)})}
function openNote(id){save();current=id;let n=data.find(x=>x.id===id);title.value=n.title;content.innerHTML=n.content;render();countWords()}
function newNote(){save();let n={id:Date.now(),title:'Untitled note',content:'',updated:Date.now()};data.push(n);current=n.id;title.value='';content.innerHTML='';save();title.focus()}
function deleteNote(){if(!current||!confirm('Delete this note?'))return;data=data.filter(n=>n.id!==current);localStorage.setItem(KEY,JSON.stringify(data));current=null;if(!data.length)newNote();else openNote(data[0].id)}
function cmd(c){document.execCommand(c,false,null);content.focus();schedule()}
function countWords(){let t=content.innerText.trim();$('#count').textContent=(t?t.split(/\s+/).length:0)+' words'}
function downloadNote(){let blob=new Blob([(title.value||'Untitled')+'\n\n'+content.innerText],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(title.value||'note').replace(/[^a-z0-9-_ ]/gi,'')+'.txt';a.click();URL.revokeObjectURL(a.href)}
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('leaf-theme',document.documentElement.classList.contains('dark')?'dark':'light')}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
title.addEventListener('input',schedule);content.addEventListener('input',schedule);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});if(localStorage.getItem('leaf-theme')==='dark')document.documentElement.classList.add('dark');seed();openNote(data[0].id);
</script></body></html>
